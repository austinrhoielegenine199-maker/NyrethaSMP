# Level-system settings
currency: "VAULT" # DonutShards or VAULT
enabled: true
max-level: 100
announce_level_ups: true
message:
  - "&#099bff🔥 &#099bff&lFLAKE LEVEL &#099bff🔥"
  - ""
  - "&#00FF00%player% &fnow has &#099bffFlake level %shards_level%&f!"
  - ""
  - "&fFlake level ➟ &f&n/shards upgrade"

next:
  next-message: true
  next-shard-in: "&7Next Flake in &#099bff%shards_next_shard%"

area-join:
  module:
    chat:
      enabled: false
      message:
        - ""
    actionbar:
      enabled: false
      message:
        - ""
    title:
      enabled: true
      message:
        - "&#099bffᴀꜰᴋ"
    subtitle:
      enabled: true
      message:
        - "&fEarn one Flake per minute"

level-settings:
  shards-added: "&7You received &#099bff+%shards_added% Flakes!"
  level_up_message: "&#00FF00You upgraded your Flake level to &#099bff%shards_level%&#00FF00!"
  more-shards-per-upgrade: 1
  default-shards-per-minute: 1
  base_cost: "100k"
  cost_multiplier: "25%"
