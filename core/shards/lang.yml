command-usage: |
  &#099bff&lFLAKES
  &#099bff➤ &f/shards
  &#099bff➤ &f/shards pay <player> <amount>
  &#099bff➤ &f/shards bal <player>
  &#099bff➤ &f/shards upgrade

command-usage-admin: |
  &#FF0000&lFLAKES ADMIN
  &#FF0000➤ &f/shards reload
  &#FF0000➤ &f/shards give <player> <amount>
  &#FF0000➤ &f/shards take <player> <amount>
  &#FF0000➤ &f/shards set <player> <amount>
  &#FF0000➤ &f/shards booster <player> <time> <amount>
  &#FF0000➤ &f/shards clear all-players
