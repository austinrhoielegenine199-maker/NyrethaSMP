command-usage: |
  &x&2&4&F&1&0&4&lHOME
  &x&2&4&F&1&0&4➤ &f/home
  &x&2&4&F&1&0&4➤ &f/sethome <1-5>
  &x&2&4&F&1&0&4➤ &f/delhome <1-5>
command-usage-admin: |
  &c&lHOME ADMIN
  &c➤ &f/home reload
  &c➤ &f/home admin <player>
cooldown:
  module:
    chat:
      enabled: true
      message: ["&fTeleport in &b%count% &fseconds"]
    actionbar:
      enabled: true
      message: ["&fTeleport in &b%count% &fseconds"]
    title:
      enabled: false
      message: [""]
    subtitle:
      enabled: false
      message: [""]
