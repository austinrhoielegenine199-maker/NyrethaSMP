title: "&8Homes"
rows: 4

homes:
  slot-beds: "11,12,13,14,15"
  slot-dyes: "20,21,22,23,24"

home-set:
  bed:
    name: "&bHome %home%"
    material: "LIGHT_BLUE_BED"
    lore:
      - "&fClick to teleport"
  dye:
    name: "&bHome %home%"
    material: "BLUE_DYE"
    lore:
      - "&fClick to delete"

home-not-set:
  bed:
    name: "&7No home set"
    material: "LIGHT_GRAY_BED"
    lore:
      - "&fClick to save your location"
  dye:
    name: "&7No home set"
    material: "GRAY_DYE"
    lore:
      - "&fClick to save your location"

no-permission:
  bed:
    name: "&cNo permission"
    material: "RED_BED"
    lore:
      - "&fYou don't have permission to use this home slot."
  dye:
    name: "&cNo permission"
    material: "RED_DYE"
    lore:
      - "&fYou don't have permission to use this home slot."
