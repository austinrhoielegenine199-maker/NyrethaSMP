name: Build NyrethaSMP

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NyrethaSMP
          path: target/*.jar
